<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inglês Todo Dia</title>
<meta name="description" content="Trilha de inglês de 360 dias: sessão diária pronta, 90 textos com áudio e atalhos gratuitos.">
<meta name="theme-color" content="#ECEFE8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1310" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Inglês">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 26 L12 11 L17 18 L21 13 L29 26 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="21" cy="7" r="2.4" fill="currentColor"/></svg>
      Inglês Todo Dia
    </div>
    <span class="sync" id="sync" data-s="local">Salvo neste aparelho</span>
    <nav class="tabs" role="tablist" aria-label="Seções">
      <button role="tab" id="tab-hoje" data-view="hoje" aria-selected="true">Hoje</button>
      <button role="tab" id="tab-trilha" data-view="trilha" aria-selected="false">Trilha</button>
      <button role="tab" id="tab-textos" data-view="textos" aria-selected="false">Textos</button>
      <button role="tab" id="tab-atalhos" data-view="atalhos" aria-selected="false">Atalhos</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="view" id="view-hoje"></section>
  <section class="view" id="view-trilha" hidden></section>
  <section class="view" id="view-textos" hidden></section>
  <section class="view" id="view-atalhos" hidden></section>
</main>

<script src="js/textos.js"></script>
<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
